[workspace]
resolver = "2"
members = ["crates/reversal-core", "crates/reversal-cli"]

[workspace.package]
version = "0.1.1"
edition = "2021"
# The oldest Rust that builds this; clippy warns about anything newer.
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/janwiktor/reversal"

[profile.release]
debug = false
opt-level = 3

[profile.dev]
opt-level = 2
