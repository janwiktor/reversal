[workspace]
resolver = "2"
members = ["crates/reversal-core", "crates/reversal-cli", "crates/reversal-ios"]
# The iOS engine only builds through packaging/ios; `--workspace` still checks it.
default-members = ["crates/reversal-core", "crates/reversal-cli"]

[workspace.package]
version = "0.3.2"
edition = "2021"
# The oldest Rust that builds this; clippy warns about anything newer.
rust-version = "1.88"
license = "MPL-2.0"
repository = "https://github.com/janwiktor/reversal"

[profile.release]
debug = false
opt-level = 3

[profile.dev]
opt-level = 2
