name: Release

# Pushing a tag like v0.1.0 makes a draft pre-release with the Mac app. Publishing the draft
# stays a person's decision, on the release page.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare the tag with Cargo.toml and main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG doesn't match version $version in Cargo.toml." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $TAG isn't on main." >&2
            exit 1
          fi

  app:
    name: Mac app
    needs: check
    uses: ./.github/workflows/mac-app.yml

  draft:
    name: Draft the release
    needs: app
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Reversal-mac-app
          path: assets
      - name: Add the checksum and the source of what's in the app
        run: |
          # The GPL asks for the source of everything in the app. GitHub adds this repo's own to
          # the release, and these are the rest: LibRaw and the Rust crates.
          version="${GITHUB_REF_NAME#v}"
          cargo vendor --locked vendor >/dev/null
          tar -czf "assets/Reversal-$version-rust-crates-source.tar.gz" vendor
          libraw_version="$(sed -n 's/^LIBRAW_VERSION=//p' packaging/macos/libraw.sh)"
          libraw_sha256="$(sed -n 's/^LIBRAW_SHA256=//p' packaging/macos/libraw.sh)"
          libraw="LibRaw-$libraw_version.tar.gz"
          curl -fsSL -o "assets/$libraw" "https://www.libraw.org/data/$libraw"
          echo "$libraw_sha256  assets/$libraw" | sha256sum -c -
          cd assets
          for dmg in Reversal-*.dmg; do sha256sum "$dmg" >"$dmg.sha256"; done
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" assets/* --draft --prerelease --verify-tag \
            --title "Reversal ${TAG#v}" --generate-notes
