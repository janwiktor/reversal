name: Wiki

# The wiki is a copy of docs/ for reading on GitHub. Edit the files in docs/, not the wiki.
on:
  push:
    branches: [main]
    paths:
      - "docs/*.md"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    name: Copy docs to the wiki
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A wiki has no repository until its first page is made on GitHub.
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.wiki.git"
          if ! git clone --depth 1 "$remote" wiki 2>/dev/null; then
            echo "::notice::No wiki yet, so nothing was synced."
            exit 0
          fi
          # Every page is generated, so start from none: a renamed doc leaves no stale page behind.
          rm -f wiki/*.md
          # Links between docs become wiki page names. Images stay in the repository and load from main.
          images="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/docs/images/"
          convert() {
            sed -e 's#(spec\.md#(Product-Spec#g' \
              -e 's#(conversion-method\.md#(Conversion-Method#g' \
              -e 's#(research-notes\.md#(Research-Notes#g' \
              -e "s#](images/#](${images}#g" "docs/$1" >"wiki/$2.md"
          }
          convert spec.md Product-Spec
          convert conversion-method.md Conversion-Method
          convert research-notes.md Research-Notes
          cat >wiki/Home.md <<'EOF'
          # Reversal

          - [Product Spec](Product-Spec): what Reversal does and why
          - [Conversion Method](Conversion-Method): how a negative becomes a positive DNG, step by step, with formulas and evidence
          - [Research Notes](Research-Notes): the working record of every choice, test and source along the way

          All documentation here is a work in progress. It may not be fully accurate, and it may not be
          updated at the same pace as the code.

          For how to install and use it, see the [README](https://github.com/janwiktor/reversal#readme).
          EOF
          cat >wiki/_Footer.md <<'EOF'
          Work in progress: these docs may not be fully accurate or as current as the code. Generated from [`docs/`](https://github.com/janwiktor/reversal/tree/main/docs). Changes go there, not here.
          EOF
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Sync from $GITHUB_SHA"
          git push
