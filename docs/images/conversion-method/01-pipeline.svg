<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 984 264" width="984" height="264" role="img" aria-label="Ten processing steps in two rows, from decode to writing the DNG"><style>
text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #566170; }
text.lbl { fill: #15191e; font-size: 11.5px; }
text.ttl { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #15191e; }
text.sm { font-size: 10.5px; }
text.on-dark { fill: #ffffff; }
.grid { stroke: #d5dbe2; stroke-width: 1; fill: none; }
.axis { stroke: #566170; stroke-width: 1; fill: none; }
.line { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.ref { fill: none; stroke: #566170; stroke-width: 1.2; stroke-dasharray: 4 4; }
.box { fill: #ffffff; stroke: #566170; stroke-width: 1.2; }
.boxa { fill: #f7e3d6; stroke: #c0551a; stroke-width: 1.4; }
.arr { stroke: #566170; stroke-width: 1.4; fill: none; }
.c-ink { stroke: #15191e; } .c-r { stroke: #c2362f; } .c-b { stroke: #2d5fc0; }
.c-a { stroke: #c0551a; } .c-m { stroke: #566170; }
text.t-r { fill: #c2362f; } text.t-b { fill: #2d5fc0; } text.t-a { fill: #c0551a; }
.dash { stroke-dasharray: 6 4; }
</style><rect x="-12" y="-12" width="984" height="264" fill="#ffffff" rx="8"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#566170"/></marker></defs><rect class="box" x="8" y="14" width="168" height="78" rx="6"/><text class="ttl" x="20" y="38">Decode</text><text class="sm" x="20" y="59">Raw → linear RGB</text><text class="sm" x="20" y="76">LibRaw, AHD, gamma 1</text><line class="arr" x1="179" y1="53.0" x2="199" y2="53.0" marker-end="url(#ah)"/><rect class="boxa" x="202" y="14" width="168" height="78" rx="6"/><text class="ttl" x="214" y="38">Measure</text><text class="sm" x="214" y="59">Base, area, film type,</text><text class="sm" x="214" y="76">gray curves, anchor</text><line class="arr" x1="373" y1="53.0" x2="393" y2="53.0" marker-end="url(#ah)"/><rect class="boxa" x="396" y="14" width="168" height="78" rx="6"/><text class="ttl" x="408" y="38">Density above base</text><text class="sm" x="408" y="59">−log10(T / T_base)</text><text class="sm" x="408" y="76">removes the mask</text><line class="arr" x1="567" y1="53.0" x2="587" y2="53.0" marker-end="url(#ah)"/><rect class="boxa" x="590" y="14" width="168" height="78" rx="6"/><text class="ttl" x="602" y="38">Gray curves</text><text class="sm" x="602" y="59">R, B onto green density</text><text class="sm" x="602" y="76">fitted per frame</text><line class="arr" x1="761" y1="53.0" x2="781" y2="53.0" marker-end="url(#ah)"/><rect class="box" x="784" y="14" width="168" height="78" rx="6"/><text class="ttl" x="796" y="38">Crosstalk</text><text class="sm" x="796" y="59">Fixed density matrix</text><text class="sm" x="796" y="76">neutrals unchanged</text><rect class="box" x="8" y="140" width="168" height="78" rx="6"/><text class="ttl" x="20" y="164">Toe</text><text class="sm" x="20" y="185">Shared, near the base</text><text class="sm" x="20" y="202">0.3 · exp(−E / 0.35)</text><line class="arr" x1="179" y1="179.0" x2="199" y2="179.0" marker-end="url(#ah)"/><rect class="boxa" x="202" y="140" width="168" height="78" rx="6"/><text class="ttl" x="214" y="164">Back to linear</text><text class="sm" x="214" y="185">Anchor, γ = 0.7, sliders</text><text class="sm" x="214" y="202">in stops per channel</text><line class="arr" x1="373" y1="179.0" x2="393" y2="179.0" marker-end="url(#ah)"/><rect class="box" x="396" y="140" width="168" height="78" rx="6"/><text class="ttl" x="408" y="164">Saturation</text><text class="sm" x="408" y="185">Around Rec.2020 luma</text><text class="sm" x="408" y="202">gain 1.25 × (1 + s/100)</text><line class="arr" x1="567" y1="179.0" x2="587" y2="179.0" marker-end="url(#ah)"/><rect class="box" x="590" y="140" width="168" height="78" rx="6"/><text class="ttl" x="602" y="164">Geometry</text><text class="sm" x="602" y="185">Mirror, quarter turns</text><text class="sm" x="602" y="202">after inversion</text><line class="arr" x1="761" y1="179.0" x2="781" y2="179.0" marker-end="url(#ah)"/><rect class="box" x="784" y="140" width="168" height="78" rx="6"/><text class="ttl" x="796" y="164">Write DNG</text><text class="sm" x="796" y="185">16-bit, headroom</text><text class="sm" x="796" y="202">lossless JPEG tiles</text><path class="arr" d="M868.0 94V114H92.0V136" marker-end="url(#ah)"/><text class="sm" x="8" y="236">Straighten and crop run before “Density above base”.</text><rect class="boxa" x="528" y="226" width="14" height="9" rx="2"/><text class="sm" x="548" y="235">uses values measured on this frame</text></svg>
