<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 544 424" width="544" height="424" role="img" aria-label="A film scan with holder, film base patch and the centered measured area"><style>
text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #566170; }
text.lbl { fill: #15191e; font-size: 11.5px; }
text.ttl { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #15191e; }
text.sm { font-size: 10.5px; }
text.on-dark { fill: #ffffff; }
.grid { stroke: #d5dbe2; stroke-width: 1; fill: none; }
.axis { stroke: #566170; stroke-width: 1; fill: none; }
.line { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.ref { fill: none; stroke: #566170; stroke-width: 1.2; stroke-dasharray: 4 4; }
.box { fill: #ffffff; stroke: #566170; stroke-width: 1.2; }
.boxa { fill: #f7e3d6; stroke: #c0551a; stroke-width: 1.4; }
.arr { stroke: #566170; stroke-width: 1.4; fill: none; }
.c-ink { stroke: #15191e; } .c-r { stroke: #c2362f; } .c-b { stroke: #2d5fc0; }
.c-a { stroke: #c0551a; } .c-m { stroke: #566170; }
text.t-r { fill: #c2362f; } text.t-b { fill: #2d5fc0; } text.t-a { fill: #c0551a; }
.dash { stroke-dasharray: 6 4; }
</style><rect x="-12" y="-12" width="544" height="424" fill="#ffffff" rx="8"/><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#1b1e22"/><line x1="0" y1="0" x2="0" y2="7" stroke="#c2362f" stroke-width="2.2"/></pattern><linearGradient id="pic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6c4a2f"/><stop offset=".45" stop-color="#8a6240"/><stop offset=".7" stop-color="#3f3a36"/><stop offset="1" stop-color="#26231f"/></linearGradient></defs><rect x="10" y="10" width="500" height="320" fill="url(#hatch)"/><rect x="40" y="30" width="440" height="280" fill="#b5651e"/><rect x="70" y="50" width="380" height="218" fill="url(#pic)"/><circle cx="360" cy="110" r="22" fill="#2b2622"/><rect x="100" y="278" width="150" height="14" fill="none" stroke="#f7e3d6" stroke-width="2.4"/><rect x="47.5" y="34" width="425" height="272" fill="none" stroke="#2d5fc0" stroke-width="2.4" stroke-dasharray="7 5"/><text class="lbl on-dark" x="258" y="289">film base patch</text><text class="lbl on-dark" x="82" y="82">picture</text><text class="lbl on-dark" x="18" y="24">holder</text><text class="lbl on-dark" x="150" y="47">dashed: measured area (85%)</text><rect x="10" y="343" width="14" height="10" rx="2" fill="#f7e3d6" stroke="#566170" stroke-width=".6"/><text class="lbl" x="32" y="352">Film base: largest even patch of the brightest film</text><rect x="10" y="361" width="14" height="10" rx="2" fill="#2d5fc0" stroke="#566170" stroke-width=".6"/><text class="lbl" x="32" y="370">Measured area: centered 85% of each side</text><rect x="10" y="379" width="14" height="10" rx="2" fill="#c2362f" stroke="#566170" stroke-width=".6"/><text class="lbl" x="32" y="388">Holder: dense cells connected to the scan's edge, ignored</text></svg>
