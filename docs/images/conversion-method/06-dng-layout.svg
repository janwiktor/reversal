<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 744 324" width="744" height="324" role="img" aria-label="DNG layout: IFD0 with thumbnail, tags, profiles and XMP; sub-IFDs for the image and the preview"><style>
text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #566170; }
text.lbl { fill: #15191e; font-size: 11.5px; }
text.ttl { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #15191e; }
text.sm { font-size: 10.5px; }
text.on-dark { fill: #ffffff; }
.grid { stroke: #d5dbe2; stroke-width: 1; fill: none; }
.axis { stroke: #566170; stroke-width: 1; fill: none; }
.line { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.ref { fill: none; stroke: #566170; stroke-width: 1.2; stroke-dasharray: 4 4; }
.box { fill: #ffffff; stroke: #566170; stroke-width: 1.2; }
.boxa { fill: #f7e3d6; stroke: #c0551a; stroke-width: 1.4; }
.arr { stroke: #566170; stroke-width: 1.4; fill: none; }
.c-ink { stroke: #15191e; } .c-r { stroke: #c2362f; } .c-b { stroke: #2d5fc0; }
.c-a { stroke: #c0551a; } .c-m { stroke: #566170; }
text.t-r { fill: #c2362f; } text.t-b { fill: #2d5fc0; } text.t-a { fill: #c0551a; }
.dash { stroke-dasharray: 6 4; }
</style><rect x="-12" y="-12" width="744" height="324" fill="#ffffff" rx="8"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#566170"/></marker></defs><rect class="box" x="8" y="8" width="310" height="284" rx="8"/><text class="ttl" x="22" y="32">IFD0  ·  thumbnail and DNG tags</text><rect x="22" y="44" width="282" height="26" rx="4" fill="none" stroke="#d5dbe2"/><text class="lbl" x="32" y="61">256 px RGB thumbnail</text><rect x="22" y="78" width="282" height="26" rx="4" fill="none" stroke="#d5dbe2"/><text class="lbl" x="32" y="95">UniqueCameraModel: Reversal Positive</text><rect x="22" y="112" width="282" height="26" rx="4" fill="none" stroke="#d5dbe2"/><text class="lbl" x="32" y="129">ColorMatrix1 / ForwardMatrix1 (D65)</text><rect x="22" y="146" width="282" height="26" rx="4" fill="none" stroke="#d5dbe2"/><text class="lbl" x="32" y="163">AsShotNeutral 1, 1, 1</text><rect x="22" y="180" width="282" height="26" rx="4" fill="none" stroke="#d5dbe2"/><text class="lbl" x="32" y="197">BaselineExposure 0</text><rect x="22" y="214" width="282" height="26" rx="4" fill="none" stroke="#d5dbe2"/><text class="lbl" x="32" y="231">Main profile + 2 extra profiles</text><rect x="22" y="248" width="282" height="26" rx="4" fill="none" stroke="#d5dbe2"/><text class="lbl" x="32" y="265">XMP: file name, all settings</text><rect class="boxa" x="392" y="8" width="320" height="150" rx="8"/><text class="ttl" x="406" y="32">SubIFD 0  ·  the image</text><text class="lbl" x="406" y="58">LinearRaw, 3 × 16-bit</text><text class="lbl" x="406" y="80">BlackLevel 0, WhiteLevel 65535</text><text class="lbl" x="406" y="102">256 px tiles, lossless JPEG</text><text class="lbl" x="406" y="124">Frame white stored at 0.2</text><rect class="box" x="392" y="178" width="320" height="114" rx="8"/><text class="ttl" x="406" y="202">SubIFD 1  ·  preview</text><text class="lbl" x="406" y="228">1024 px sRGB JPEG, no chroma subsampling</text><text class="lbl" x="406" y="250">Rendered through the main profile</text><path class="arr" d="M318 90H392" marker-end="url(#ah)"/><path class="arr" d="M318 230H392" marker-end="url(#ah)"/><text class="sm" x="324" y="82">SubIFDs</text></svg>
