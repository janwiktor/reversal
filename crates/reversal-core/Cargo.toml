[package]
name = "reversal-core"
description = "Reversal conversion engine: decode, density inversion, positive LinearRaw DNG writer"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["libraw"]
# Raw decoding through the system LibRaw. Off for WASM builds.
libraw = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jpeg-encoder = "0.6"

[build-dependencies]
pkg-config = "0.3"
